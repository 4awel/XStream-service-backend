services:
  - type: web
    name: xstream-api
    runtime: node
    plan: free
    region: frankfurt
    # devDependencies нужны и для сборки (nest, prisma), и для сида (ts-node),
    # а при NODE_ENV=production npm ci их пропускает.
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    # Сид идемпотентен (upsert по slug), поэтому безопасно гонять при каждом старте.
    startCommand: npx prisma migrate deploy && npm run db:seed && node dist/main
    healthCheckPath: /tags
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APPLICATION_PORT
        value: "10000"
      # Адрес фронта на Netlify, например https://xstream.netlify.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: xstream-db
          property: connectionString
      - key: POSTGRES_URL
        fromDatabase:
          name: xstream-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: xstream-redis
          property: connectionString

      - key: COOKIE_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: VERIFICATION_CODE_SECRET
        generateValue: true
      - key: STREAM_KEY_SECRET
        generateValue: true
      - key: STREAM_HOOK_SECRET
        generateValue: true

      # API открывается через прокси Netlify (/api/* -> Render), поэтому cookie
      # first-party: без Domain (SESSION_DOMAIN не задаём), SameSite=lax.
      # Netlify + Render = 2 прокси.
      - key: SESSION_NAME
        value: sid
      - key: SESSION_MAX_AGE
        value: 7d
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SECURE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: SESSION_PREFIX
        value: "sess:"
      - key: TRUST_PROXY_HOPS
        value: "2"

      # Free-план Render блокирует исходящие порты 25/465/587 — нужен SMTP
      # с альтернативным портом, например Brevo (smtp-relay.brevo.com:2525).
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Адрес, подтверждённый как отправитель в SMTP-сервисе.
      - key: MAIL_FROM
        sync: false

      # Медиасервера нет — заглушки, чтобы конфиг прошёл проверку.
      - key: MEDIAMTX_RTMP_URL
        value: rtmp://media.invalid:1935
      - key: MEDIAMTX_HLS_URL
        value: https://media.invalid
      - key: MEDIAMTX_WEBRTC_URL
        value: https://media.invalid/webrtc
      - key: MEDIAMTX_API_URL
        value: http://media.invalid:9997
      - key: MEDIAMTX_SYNC_INTERVAL_MS
        value: "0"

      # Без настоящего S3 приложение стартует, но загрузка аватарок/шапок
      # будет падать. Для неё подставьте S3-совместимое хранилище (R2, Supabase).
      - key: S3_ENDPOINT
        value: https://s3.invalid
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        value: none
      - key: S3_SECRET_KEY
        value: none
      - key: S3_BUCKET
        value: stream-media
      - key: S3_PUBLIC_URL
        value: https://s3.invalid/stream-media

  - type: keyvalue
    name: xstream-redis
    plan: free
    region: frankfurt
    # Тут лежат сессии — вытеснять их нельзя.
    maxmemoryPolicy: noeviction
    # Пустой список — доступ только из сервисов Render.
    ipAllowList: []

databases:
  - name: xstream-db
    plan: free
    region: frankfurt
    databaseName: stream_service
    user: stream
