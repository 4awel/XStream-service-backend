# PROD-стек: инфраструктура + сам Nest в одной сети Docker.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Отличия от dev:
#   - порты базы и redis наружу не публикуются;
#   - API MediaMTX (9997) доступен только внутри сети;
#   - mailpit нет — письма уходят через настоящий SMTP;
#   - миграции прогоняются до старта приложения отдельным one-shot сервисом.

services:
  db:
    image: postgres:15.3
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stream-services-backend

  redis:
    image: redis:7.2.0
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - stream-services-backend

  # Прогоняет миграции и завершается. api ждёт его успешного выхода.
  migrate:
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    env_file: .env.production
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stream-services-backend

  api:
    build:
      context: .
      target: runtime
    restart: always
    env_file: .env.production
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - stream-services-backend

  # Файлы пользователей. Наружу отдаётся через TLS-прокси (S3_PUBLIC_URL),
  # консоль 9001 не публикуем.
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - stream-services-backend

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: always
    environment:
      STREAM_HOOK_SECRET: ${STREAM_HOOK_SECRET}
    ports:
      - "1935:1935" # RTMP для OBS
      - "8888:8888" # HLS (за TLS-прокси)
      - "8889:8889" # WebRTC (WHEP)
      - "8189:8189/udp" # WebRTC ICE
    volumes:
      - ./mediamtx.prod.yml:/mediamtx.yml:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - stream-services-backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  stream-services-backend:
