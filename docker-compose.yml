# DEV-окружение: инфраструктура в Docker, сам Nest запускается на хосте (npm run start:dev).
# Поэтому MediaMTX стучится в бэкенд через host.docker.internal.
# Прод — отдельный файл: docker-compose.prod.yml

services:
  db:
    container_name: postgres
    image: postgres:15.3
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USERNAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stream-services-backend

  redis:
    container_name: redis
    image: redis:7.2.0
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - stream-services-backend

  mailpit:
    container_name: mailpit
    image: axllent/mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - stream-services-backend

  mediamtx:
    container_name: mediamtx
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: always
    # Секрет уходит в заголовок X-Hook-Secret внутри runOnReady (см. mediamtx.yml).
    environment:
      STREAM_HOOK_SECRET: ${STREAM_HOOK_SECRET}
    ports:
      - "1935:1935" # RTMP — сюда публикует OBS
      - "8888:8888" # HLS — отсюда читает плеер
      - "8889:8889" # WebRTC (WHEP)
      - "8189:8189/udp" # WebRTC ICE
      - "9997:9997" # control API — бэкенд опрашивает его для синка isLive
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stream-services-backend

  # S3-совместимое хранилище: аватарки, шапки каналов, позже эмодзи.
  # API на 9000, веб-консоль на http://localhost:9001 (логин/пароль ниже).
  minio:
    container_name: minio
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - stream-services-backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  stream-services-backend:
